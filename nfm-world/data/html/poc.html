<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFMW CEF PoC</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
        background: transparent;
        font-family: 'Segoe UI', Arial, sans-serif;
        color: #fff;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
    }

    .hud {
        position: fixed;
        bottom: 30px;
        left: 30px;
        display: flex;
        gap: 16px;
    }

    .card {
        background: rgba(0, 0, 0, 0.55);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 10px;
        padding: 14px 22px;
        min-width: 120px;
    }

    .card .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 4px;
    }

    .card .value {
        font-size: 42px;
        font-weight: 700;
        line-height: 1;
    }

    #speed-card .value { color: #4fc3f7; }
    #player-card .value { font-size: 18px; font-weight: 500; color: #fff; }
    #frame-card .value { font-size: 18px; font-weight: 500; color: #aed581; }

    .status {
        position: fixed;
        top: 16px;
        right: 16px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.5);
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 10px;
        border-radius: 4px;
    }

    .perf {
        position: fixed;
        top: 16px;
        left: 16px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        background: rgba(0, 0, 0, 0.4);
        padding: 4px 10px;
        border-radius: 4px;
        font-family: monospace;
    }

    .test-input {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
    }

    .test-input input {
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.3);
        border-radius: 6px;
        color: #fff;
        padding: 8px 14px;
        font-size: 14px;
        outline: none;
        width: 240px;
    }

    .test-input input:focus {
        border-color: #4fc3f7;
    }
</style>
</head>
<body>

<div class="perf" id="perf">FPS: -- | Frame: 0</div>

<div class="hud">
    <div class="card" id="speed-card">
        <div class="label">Speed</div>
        <div class="value" id="speed">0</div>
        <div style="font-size:12px;color:rgba(255,255,255,0.4);">km/h</div>
    </div>
    <div class="card" id="player-card">
        <div class="label">Player</div>
        <div class="value" id="player">---</div>
    </div>
    <div class="card" id="frame-card">
        <div class="label">Push Frame</div>
        <div class="value" id="frame">0</div>
    </div>
</div>

<div class="status" id="status">CEF initializing...</div>

<div class="test-input">
    <input type="text" id="test-text" placeholder="Type to test keyboard input...">
</div>

<script>
(function() {
    var statusEl = document.getElementById('status');
    var speedEl = document.getElementById('speed');
    var playerEl = document.getElementById('player');
    var frameEl = document.getElementById('frame');
    var perfEl = document.getElementById('perf');

    var lastFrameTime = performance.now();
    var fpsFrames = 0;
    var fpsValue = 0;
    var lastFpsUpdate = lastFrameTime;

    function setStatus(msg) {
        statusEl.textContent = msg;
    }

    // Set up nfmwEvents listener for C# → JS push
    window.nfmwEvents = window.nfmwEvents || {
        _listeners: {},
        on: function(event, callback) {
            if (!this._listeners[event]) this._listeners[event] = [];
            this._listeners[event].push(callback);
        },
        emit: function(event, data) {
            var handlers = this._listeners[event];
            if (handlers) { handlers.forEach(function(h) { h(data); }); }
        }
    };

    // Listen for push events from C#
    nfmwEvents.on('ready', function() {
        setStatus('CEF connected');
    });

    // Per-frame update: receives speed, player, frame from C# every game frame
    nfmwEvents.on('frameUpdate', function(data) {
        speedEl.textContent = Math.round(data.speed);
        playerEl.textContent = data.player;
        frameEl.textContent = data.frame;

        // Compute JS-side FPS (how fast we're receiving push events)
        fpsFrames++;
        var now = performance.now();
        if (now - lastFpsUpdate >= 500) {
            fpsValue = Math.round(fpsFrames / ((now - lastFpsUpdate) / 1000));
            fpsFrames = 0;
            lastFpsUpdate = now;
        }
        perfEl.textContent = 'JS FPS: ' + fpsValue + ' | Frame: ' + data.frame;
    });

    // Also handle individual events (for backward compat / direct calls)
    nfmwEvents.on('speedUpdate', function(data) {
        speedEl.textContent = Math.round(data.value);
    });
    nfmwEvents.on('playerUpdate', function(data) {
        playerEl.textContent = data.value;
    });

    setStatus('CEF loaded (waiting for bridge...)');
})();
</script>

</body>
</html>
